name: Validar MARÉ

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Testar regras e integrações
        run: |
          node scripts/check-repository.cjs
          node scripts/check-sources.cjs
          node tests/smoke.cjs
          node tests/gameplay.cjs
          node tests/evolution.cjs
          node tests/play-system.cjs
          node tests/studio.cjs
      - name: Validar pacote publicado
        run: |
          node scripts/build-site.cjs
          node scripts/check-build.cjs
      - name: Auditar render real dos 12 jogos em Chromium
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
          python scripts/check-play-runtime.py
      - name: Preservar screenshots e relatório de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mare-play-chromium-qa
          path: playwright-artifacts/
          if-no-files-found: ignore
      - name: Verificar arquivos essenciais
        run: |
          test -s _site/index.html
          test -s _site/recife.html
          test -s _site/forca.html
          test -s _site/criptograma.html
          test -s _site/mare-3.css
          test -s _site/mare-newgames.css
          test -s _site/assets/backgrounds/naufrago.svg
          test -s _site/assets/backgrounds/sinais.svg
