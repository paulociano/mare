name: Publicar MARÉ no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos
        run: |
          mkdir -p _site
          cp index.html modos.js modos.css _site/
          test -s _site/index.html
          test -s _site/modos.js
          test -s _site/modos.css
          touch _site/.nojekyll
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
