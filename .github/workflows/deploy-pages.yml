name: Publicar MARÉ no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Gerar rankings semânticos']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Executar testes de regressão
        run: |
          node scripts/check-repository.cjs
          node scripts/check-sources.cjs
          node tests/smoke.cjs
          node tests/gameplay.cjs
          node tests/evolution.cjs
          node tests/play-system.cjs
          node tests/phase4-contract.cjs
          node tests/phase5-contract.cjs
          node tests/finesse.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar e validar os arquivos publicados
        run: |
          node scripts/build-site.cjs
          node scripts/check-build.cjs
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
