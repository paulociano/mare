name: Publicar MARÉ no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Gerar rankings semânticos']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Executar testes de regressão
        run: node tests/smoke.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos
        run: |
          mkdir -p _site
          cp index.html modos.js modos.css visual-v3.css contexto.html contexto.js contexto.css _site/
          mkdir -p _site/assets
          cp assets/ocean-depth.svg _site/assets/
          if [ -s data/semantic-ranks.json ]; then
            mkdir -p _site/data
            cp data/semantic-ranks.json _site/data/
          fi
          test -s _site/index.html
          test -s _site/modos.js
          test -s _site/modos.css
          test -s _site/visual-v3.css
          test -s _site/contexto.html
          test -s _site/contexto.js
          test -s _site/contexto.css
          test -s _site/assets/ocean-depth.svg
          touch _site/.nojekyll
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
