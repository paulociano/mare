name: Publicar MARÉ no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Gerar rankings semânticos']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Executar testes de regressão
        run: node tests/smoke.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos
        run: |
          mkdir -p _site
          cp index.html recife.html hub.js mare-system.css mare-editorial.css modos.js modos.css visual-v3.css abismo.html abismo.js abismo.css cardume.html cardume.js cardume.css corrente.html corrente.js corrente.css concha.html concha.js concha.css trilha.html trilha.js trilha.css enigma.html enigma.js enigma.css marujo.html marujo.js marujo.css palavras-ptbr-5.txt _site/
          mkdir -p _site/assets
          cp assets/ocean-depth.svg _site/assets/
          mkdir -p _site/assets/backgrounds
          cp assets/backgrounds/*.svg _site/assets/backgrounds/
          if compgen -G 'assets/backgrounds/*.webp' > /dev/null; then
            cp assets/backgrounds/*.webp _site/assets/backgrounds/
          fi
          test -s _site/assets/backgrounds/recife.svg
          test -s _site/assets/backgrounds/abismo.svg
          test -s _site/assets/backgrounds/cardume.svg
          test -s _site/assets/backgrounds/corrente.svg
          test -s _site/assets/backgrounds/concha.svg
          mkdir -p _site/data
          cp data/cardume-puzzles.json _site/data/
          if [ -s data/semantic-ranks.json ]; then
            mkdir -p _site/data
            cp data/semantic-ranks.json _site/data/
          fi
          test -s _site/index.html
          test -s _site/recife.html
          test -s _site/mare-system.css
          test -s _site/hub.js
          test -s _site/modos.js
          test -s _site/modos.css
          test -s _site/visual-v3.css
          test -s _site/abismo.html
          test -s _site/abismo.js
          test -s _site/abismo.css
          test -s _site/cardume.html
          test -s _site/cardume.js
          test -s _site/cardume.css
          test -s _site/corrente.html
          test -s _site/corrente.js
          test -s _site/corrente.css
          test -s _site/concha.html
          test -s _site/concha.js
          test -s _site/concha.css
          test -s _site/trilha.html
          test -s _site/trilha.js
          test -s _site/trilha.css
          test -s _site/enigma.html
          test -s _site/enigma.js
          test -s _site/enigma.css
          test -s _site/marujo.html
          test -s _site/marujo.js
          test -s _site/marujo.css
          test -s _site/assets/backgrounds/marujo.svg
          test -s _site/assets/backgrounds/enigma.svg
          test -s _site/assets/backgrounds/trilha.svg
          test -s _site/palavras-ptbr-5.txt
          test -s _site/assets/ocean-depth.svg
          touch _site/.nojekyll
      - name: Renderizar vídeo ambiente a partir do cenário MARÉ
        run: |
          mkdir -p _site/assets/videos
          python3 -m pip install --quiet --user cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='assets/backgrounds/recife.svg',write_to='/tmp/mare-fundo.png',output_width=1280,output_height=720)
          PY
          ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 18 -i /tmp/mare-fundo.png -vf "zoompan=z='min(zoom+0.00035,1.07)':d=1:s=960x540:fps=18,format=yuv420p" -t 7 -an -c:v libx264 -preset veryfast -crf 30 -movflags +faststart _site/assets/videos/oceano.mp4
          test -s _site/assets/videos/oceano.mp4
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
