name: Gerar rankings semânticos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-semantic-ranks.py'
      - 'palavras-ptbr-5.txt'
      - '.github/workflows/semantic-ranks.yml'

permissions:
  contents: write

concurrency:
  group: semantic-ranking
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/semantic-requirements.txt
      - name: Instalar bibliotecas do modelo
        run: pip install -r scripts/semantic-requirements.txt
      - name: Gerar dados de similaridade
        run: python scripts/build-semantic-ranks.py
      - name: Validar dados
        run: |
          python -c "import json; d=json.load(open('data/semantic-ranks.json')); assert len(d['rounds'])==42; assert d['vocabularySize']>=8000"
      - name: Registrar dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/semantic-ranks.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualiza rankings vetoriais multilíngues"
            git push
          fi
